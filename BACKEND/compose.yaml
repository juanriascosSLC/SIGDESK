services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sigdesk
      POSTGRES_USER: sigdesk
      POSTGRES_PASSWORD: sigdesk
    ports:
      - "5432:5432"
    volumes:
      # Migrations are applied by the API at startup from migrations/embed.go,
      # which also upgrades existing volumes. They are deliberately NOT
      # mounted into docker-entrypoint-initdb.d: on a fresh volume that would
      # run every script twice (once by initdb, once by the runner, whose
      # schema_migrations table starts empty), which breaks any migration that
      # is not perfectly idempotent.
      - sigdesk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigdesk -d sigdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    environment:
      APP_ENV: development
      PORT: 8080
      # The dev server runs on 5199 (see .claude/launch.json); override for 3003.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5199}
      DATABASE_URL: postgres://sigdesk:sigdesk@postgres:5432/sigdesk?sslmode=disable
      ATTACHMENTS_DIR: /data/attachments
      # Company-wide auth service (ADR-0007). Without it the API runs with
      # authentication and permission checks DISABLED, which is why every
      # endpoint used to answer 200 to an anonymous request.
      SIGTOOLS_API_URL: ${SIGTOOLS_API_URL:-http://api.sig.systems:8091}
      # SIG-DESK's own roles live in its database (ADR-0008). Set this to your
      # SIGTools username, otherwise nobody can reach role administration and
      # there is no way to grant the first role:
      #   SIGDESK_BOOTSTRAP_ADMINS=tu.usuario docker compose up -d --build api
      SIGDESK_BOOTSTRAP_ADMINS: ${SIGDESK_BOOTSTRAP_ADMINS:-}
    ports:
      - "8080:8080"
    volumes:
      - sigdesk_attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sigdesk_postgres_data:
  sigdesk_attachments:

# SIG-Desk — Catálogo de Domain Events
# Fuente de verdad única para todos los eventos de dominio del sistema.
# Extraído de sig-desk-architecture-spec.yaml (v0.2) el 2026-07-03.
#
# Este archivo es la base para generar asyncapi.yaml. Si se agrega, renombra
# o modifica un evento acá, hay que regenerar/actualizar asyncapi.yaml
# también.
#
# Convención de tipos de payload:
#   uuid       -> identificador único (string, formato uuid)
#   string     -> texto libre o enum (se indica el enum cuando se conoce)
#   integer    -> número entero
#   boolean    -> true/false
#   datetime   -> fecha y hora, formato ISO 8601
#   object     -> estructura anidada, forma libre (a definir con más detalle
#                 cuando se implemente el servicio correspondiente)

meta:
  nombre: "SIG-Desk Domain Events Catalog"
  version: "1.0"
  fecha: "2026-07-03"
  fuente: "Extraído de sig-desk-architecture-spec.yaml v0.2, sección catalogo_domain_events"
  nota: "Nombres de eventos y payloads ya reflejan el rename agente→agente_it / especialidad→habilidad (v0.2 del spec principal)"

servicios:

  organization_service:
    eventos:
      - evento: CompanyCreada
        trigger: "Alta de empresa/depto/equipo"
        payload:
          - campo: company_id
            tipo: uuid
          - campo: tipo
            tipo: string
            nota: "enum a confirmar: empresa | departamento | equipo"
          - campo: parent_id
            tipo: uuid
            nota: "nulo si es la raíz (empresa)"
        consumidores: [audit_service]

      - evento: CompanyActualizada
        trigger: "Cambio de jerarquía"
        payload:
          - campo: company_id
            tipo: uuid
          - campo: cambios
            tipo: object
            nota: "diff de campos modificados, forma libre"
        consumidores: [audit_service]

      - evento: UsuarioCreado
        trigger: "Alta de usuario"
        payload:
          - campo: usuario_id
            tipo: uuid
          - campo: company_id
            tipo: uuid
          - campo: role_id
            tipo: uuid
        consumidores: [audit_service, notification_service]

      - evento: UsuarioActualizado
        trigger: "Cambio de rol/company"
        payload:
          - campo: usuario_id
            tipo: uuid
          - campo: cambios
            tipo: object
        consumidores: [audit_service]

      - evento: UsuarioDesactivado
        trigger: "Baja de usuario"
        payload:
          - campo: usuario_id
            tipo: uuid
        consumidores: [tickets_service, audit_service]

      - evento: AgenteITCreado
        trigger: "Alta de agente IT"
        payload:
          - campo: agente_it_id
            tipo: uuid
          - campo: usuario_id
            tipo: uuid
          - campo: habilidad
            tipo: string
            nota: "categoría de ticket que puede atender; podría ser array si un agente cubre más de una categoría — a confirmar"
        consumidores: [audit_service]

      - evento: AgenteITHabilidadActualizada
        trigger: "Cambio de categoría que atiende"
        payload:
          - campo: agente_it_id
            tipo: uuid
          - campo: habilidad_nueva
            tipo: string
        consumidores: [workflow_service, audit_service]

      - evento: AgenteITCapacidadCargaActualizada
        trigger: "Cambio de capacidad máxima"
        payload:
          - campo: agente_it_id
            tipo: uuid
          - campo: capacidad
            tipo: integer
            nota: "cantidad máxima de tickets simultáneos — NO confundir con habilidad"
        consumidores: [tickets_service]

      - evento: RolCreado
        trigger: "Alta de rol configurable"
        payload:
          - campo: role_id
            tipo: uuid
        consumidores: [audit_service]

      - evento: RolPermisosActualizado
        trigger: "Cambio de permisos de un rol"
        payload:
          - campo: role_id
            tipo: uuid
          - campo: permisos
            tipo: object
            nota: "matriz acción→entidad permitida, forma libre"
        consumidores: [audit_service]

  resource_service:
    eventos:
      - evento: RecursoCreado
        trigger: "Alta de hardware/software/red"
        payload:
          - campo: recurso_id
            tipo: uuid
          - campo: tipo
            tipo: string
            nota: "enum: hardware | software_licencia | infraestructura_red"
        consumidores: [audit_service]

      - evento: RecursoEstadoCambiado
        trigger: "Cambio de lifecycle del recurso"
        payload:
          - campo: recurso_id
            tipo: uuid
          - campo: estado_anterior
            tipo: string
            nota: "enum: adquisicion | en_uso | mantenimiento | baja"
          - campo: estado_nuevo
            tipo: string
            nota: "mismo enum que estado_anterior"
        consumidores: [tickets_service, audit_service]

      - evento: RecursoResponsableAsignado
        trigger: "Se define manager del recurso"
        payload:
          - campo: recurso_id
            tipo: uuid
          - campo: usuario_id
            tipo: uuid
        consumidores: [notification_service]

      - evento: RecursoCompartidoConCompany
        trigger: "Vinculación N:M recurso-company"
        payload:
          - campo: recurso_id
            tipo: uuid
          - campo: company_id
            tipo: uuid
        consumidores: [audit_service]

      - evento: LicenciaProximaAVencer
        trigger: "Job programado detecta vencimiento cercano"
        payload:
          - campo: recurso_id
            tipo: uuid
          - campo: fecha_vencimiento
            tipo: datetime
        consumidores: [notification_service]

      - evento: MantenimientoProgramado
        trigger: "Job programado dispara mantenimiento"
        payload:
          - campo: recurso_id
            tipo: uuid
          - campo: fecha_mantenimiento
            tipo: datetime
        consumidores: [notification_service]

      - evento: RecursoDadoDeBaja
        trigger: "Baja definitiva del recurso"
        payload:
          - campo: recurso_id
            tipo: uuid
        consumidores: [tickets_service, audit_service]

  tickets_service:
    eventos:
      - evento: TicketCreado
        trigger: "Al crear el ticket"
        payload:
          - campo: ticket_id
            tipo: uuid
          - campo: recurso_id
            tipo: uuid
          - campo: creador_id
            tipo: uuid
          - campo: categoria_id
            tipo: uuid
        consumidores: [workflow_service, ai_advisor_service, notification_service, audit_service]

      - evento: TicketAsignado
        trigger: "Primer responsable definido (auto o manual)"
        payload:
          - campo: ticket_id
            tipo: uuid
          - campo: agente_it_id
            tipo: uuid
          - campo: tipo_asignacion
            tipo: string
            nota: "enum: automatica | manual"
        consumidores: [notification_service, audit_service]

      - evento: TicketReasignado
        trigger: "Reasignación manual"
        payload:
          - campo: ticket_id
            tipo: uuid
          - campo: agente_it_anterior
            tipo: uuid
          - campo: agente_it_nuevo
            tipo: uuid
        consumidores: [notification_service, audit_service]

      - evento: TicketEscaladoAIT
        trigger: "Se deriva a agente IT especialista"
        payload:
          - campo: ticket_id
            tipo: uuid
          - campo: agente_it_id
            tipo: uuid
        consumidores: [notification_service, audit_service]

      - evento: TicketEstadoCambiado
        trigger: "Transición de lifecycle"
        payload:
          - campo: ticket_id
            tipo: uuid
          - campo: estado_anterior
            tipo: string
            nota: "enum: abierto | en_progreso | resuelto | cerrado | reabierto"
          - campo: estado_nuevo
            tipo: string
            nota: "mismo enum que estado_anterior"
        consumidores: [notification_service, ai_advisor_service, audit_service]

      - evento: TicketSLAEnRiesgo
        trigger: "Se acerca el tiempo límite (umbral de alerta)"
        payload:
          - campo: ticket_id
            tipo: uuid
          - campo: tiempo_restante
            tipo: integer
            nota: "segundos restantes hasta incumplimiento — unidad a confirmar"
        consumidores: [notification_service]

      - evento: TicketSLAIncumplido
        trigger: "Se venció el SLA"
        payload:
          - campo: ticket_id
            tipo: uuid
          - campo: tiempo_excedido
            tipo: integer
            nota: "segundos de exceso sobre el límite — unidad a confirmar"
        consumidores: [notification_service, audit_service]

      - evento: TicketDestinatariosActualizados
        trigger: "Cambia la lista de a quién notificar"
        payload:
          - campo: ticket_id
            tipo: uuid
          - campo: destinatarios
            tipo: object
            nota: "array de usuario_id, forma libre por ahora"
        consumidores: [notification_service]

      - evento: TicketResuelto
        trigger: "Cambia a estado resuelto"
        payload:
          - campo: ticket_id
            tipo: uuid
        consumidores: [notification_service, ai_advisor_service]

      - evento: TicketCerrado
        trigger: "Cierre definitivo"
        payload:
          - campo: ticket_id
            tipo: uuid
        consumidores: [notification_service, audit_service]

      - evento: TicketReabierto
        trigger: "Reapertura"
        payload:
          - campo: ticket_id
            tipo: uuid
          - campo: motivo
            tipo: string
        consumidores: [notification_service, audit_service]

      - evento: SugerenciaAplicada
        trigger: "Un humano confirma una sugerencia de IA"
        payload:
          - campo: ticket_id
            tipo: uuid
          - campo: sugerencia_id
            tipo: uuid
          - campo: decision
            tipo: string
            nota: "enum: aplicada | descartada — redundante con el nombre del evento, evaluar si se necesita"
        consumidores: [ai_advisor_service, audit_service]

      - evento: SugerenciaDescartada
        trigger: "Un humano rechaza una sugerencia de IA"
        payload:
          - campo: ticket_id
            tipo: uuid
          - campo: sugerencia_id
            tipo: uuid
          - campo: decision
            tipo: string
        consumidores: [ai_advisor_service, audit_service]

  workflow_service:
    eventos:
      - evento: WorkflowPublicado
        trigger: "Se activa una versión de reglas"
        payload:
          - campo: workflow_id
            tipo: uuid
          - campo: categoria_id
            tipo: uuid
          - campo: version
            tipo: integer
        consumidores: [audit_service]

      - evento: WorkflowDesactivado
        trigger: "Se despublica un workflow"
        payload:
          - campo: workflow_id
            tipo: uuid
        consumidores: [audit_service]

      - evento: ReglaEjecutada
        trigger: "El motor evalúa condiciones sobre un ticket (reacciona a TicketCreado)"
        payload:
          - campo: workflow_id
            tipo: uuid
          - campo: ticket_id
            tipo: uuid
          - campo: accion_resultante
            tipo: string
            nota: "descripción de la acción disparada: asignar, marcar_sla, definir_destinatarios, etc."
        consumidores: [tickets_service, notification_service, audit_service]
        nota: "Pieza central de la coreografía: TicketCreado -> ReglaEjecutada -> tickets_service aplica la acción (asignar, marcar SLA, definir destinatarios)"

  notification_service:
    eventos:
      - evento: NotificacionEnviada
        trigger: "Envío exitoso por cualquier canal"
        payload:
          - campo: notificacion_id
            tipo: uuid
          - campo: canal
            tipo: string
            nota: "enum: email | push | sms | in_app"
          - campo: destinatario
            tipo: string
            nota: "email, teléfono o usuario_id según canal"
        consumidores: [audit_service]

      - evento: NotificacionFallida
        trigger: "Falla de entrega"
        payload:
          - campo: notificacion_id
            tipo: uuid
          - campo: canal
            tipo: string
            nota: "enum: email | push | sms | in_app"
          - campo: error
            tipo: string
        consumidores: [audit_service]

      - evento: PreferenciaCanalActualizada
        trigger: "Usuario cambia su canal preferido"
        payload:
          - campo: usuario_id
            tipo: uuid
          - campo: canal
            tipo: string
            nota: "enum: email | push | sms | in_app"
        consumidores: []
        nota: "Uso interno del servicio, no se publica externamente por ahora"

  ai_advisor_service:
    eventos:
      - evento: SugerenciaGenerada
        trigger: "Triage, copiloto o chatbot produce una sugerencia"
        payload:
          - campo: ticket_id
            tipo: uuid
          - campo: tipo_sugerencia
            tipo: string
            nota: "enum: triage | copiloto | chatbot"
          - campo: contenido
            tipo: string
            nota: "texto de la sugerencia — podría ser object estructurado según tipo_sugerencia, a confirmar en implementación"
        consumidores: [tickets_service]

      - evento: EscaladoAAgenteHumano
        trigger: "El chatbot determina que no puede resolver solo"
        payload:
          - campo: ticket_id
            tipo: uuid
          - campo: contexto
            tipo: object
            nota: "resumen de la conversación/estado del chatbot, forma libre"
        consumidores: [tickets_service, notification_service]

  audit_service:
    eventos: []
    nota: "No publica eventos de negocio propios. Es un sumidero puro: se suscribe a TODOS los eventos de TODOS los servicios listados arriba y los persiste en log_auditoria. Al agregar un evento nuevo a cualquier servicio, agregar también su suscripción acá (actualizar la lista de consumidores del evento correspondiente)."

pendientes_de_este_catalogo:
  - "Confirmar unidad de tiempo para tiempo_restante / tiempo_excedido (segundos vs. minutos)"
  - "Confirmar si habilidad de un agente_it es un valor único o una lista (un agente podría cubrir varias categorías)"
  - "Definir forma concreta (schema) de los campos tipo 'object': cambios, permisos, destinatarios, contexto"
  - "Evaluar si decision en SugerenciaAplicada/SugerenciaDescartada es redundante con el nombre del evento y se puede eliminar del payload"

# SIG-Desk — Especificación de Arquitectura
# Documento de referencia estructurado, pensado para ser consumido por una IA
# (Claude u otra) como contexto de arquitectura. Actualizar este archivo
# cada vez que se agregue o modifique un dominio, entidad o lógica de negocio.

meta:
  nombre_proyecto: "SIG-Desk"
  descripcion: "Sistema de gestión de tickets/service desk con estructura organizacional única (no multi-tenant): usuarios y agentes IT conviven en el mismo árbol Empresa → Departamento → Equipo."
  version: "0.5"
  ultima_actualizacion: "v0.5: declarado formalmente monolito modular en Go (ADR-0006), reemplazando el supuesto de microservicios; Kafka (ADR-0004) y Temporal (ADR-0003) quedan diferidos, no descartados. v0.4: decisiones cerradas — bus de mensajería (Kafka, ADR-0004) y motor de workflows (Temporal, ADR-0003). v0.3: catálogo de eventos extraído a domain-events.yaml + asyncapi.yaml. v0.2: rename en cascada 'agentes'→'agente_it' y 'especialidad'→'habilidad'."

changelog:
  - version: "0.5"
    fecha: "2026-07-28"
    cambios:
      - "Decisión formal: SIG-DESK comienza como monolito modular en Go, no microservicios — ver ADR-0006. Los módulos podrán extraerse como microservicios únicamente cuando existan necesidades demostrables de escalabilidad, despliegue independiente o aislamiento operacional."
      - "Actualizada arquitectura_general.despliegue: de 'Microservicios — un servicio por bounded context, base de datos propia por servicio' a 'Monolito modular en Go — un binario (cmd/api/main.go), módulos como paquetes bajo internal/ (tickets, catalog, platform, …), una sola base de datos PostgreSQL compartida'"
      - "Actualizada arquitectura_general.comunicacion_entre_servicios: de 'Coreografía basada en eventos vía Apache Kafka' a 'Llamadas de función in-process entre módulos dentro del mismo binario; sin bus de mensajería externo mientras no existan servicios separados'"
      - "ADR-0003 (Temporal) y ADR-0004 (Kafka) quedan diferidos, no descartados — ver notas de superación en cada ADR y en ADR-0006"
      - "ADR-0001 y ADR-0002 se mantienen vigentes en su razonamiento de fondo; se agregan notas de superación puntuales sobre el supuesto de servicios separados — ver ADR-0006"
  - version: "0.4"
    fecha: "2026-07-03"
    cambios:
      - "Decisión cerrada: bus de mensajería = Kafka (gestionado, no self-hosted inicialmente) — ver ADR-0004"
      - "Decisión cerrada: motor de workflows = Temporal — ver ADR-0003 (actualizado de 'Propuesta' a 'Aceptada'). Motivo: los workflows reales requieren pasos de larga duración con decisiones humanas intermedias (orden de días), no solo reglas if/then reactivas"
      - "Resueltos 2 ítems de pendientes_abiertos: 'Elegir tecnología de bus de mensajería' y 'Evaluar si workflow_service se construye propio o se adopta un motor existente'"
      - "Actualizada clasificacion_estrategica_ddd.generic_subdomains: nota de workflow_service ya no dice 'candidato a', ahora referencia la decisión de Temporal"
      - "Actualizada arquitectura_general.comunicacion_entre_servicios para nombrar Kafka explícitamente"
  - version: "0.3"
    fecha: "2026-07-03"
    cambios:
      - "Catálogo de eventos (catalogo_domain_events) extraído a domain-events.yaml — ahora es la fuente única de verdad, este spec solo referencia su ubicación"
      - "Generado asyncapi.yaml con schemas de payload formales (tipos, enums, required) a partir de domain-events.yaml"
      - "domain-events.yaml agrega tipos de dato explícitos por campo de payload que antes no existían en este spec (ver pendientes_de_este_catalogo dentro de ese archivo)"
  - version: "0.2"
    fecha: "2026-07-03"
    cambios:
      - "Rename en cascada: entidad/id 'agentes' → 'agente_it' (nombre human-readable: 'Agente IT / Support' — ver glossary.md)"
      - "Rename en cascada: atributo/lógica 'especialidad' → 'habilidad', para evitar colisión con el término 'Capacidad' (carga máxima de tickets, ver AgenteITCapacidadCargaActualizada)"
      - "Eventos renombrados: AgenteCreado → AgenteITCreado, AgenteEspecialidadActualizada → AgenteITHabilidadActualizada, AgenteCapacidadCargaActualizada → AgenteITCapacidadCargaActualizada"
      - "Puerto renombrado: AgenteValidatorPort → AgenteITValidatorPort"
      - "Pendiente: actualizar diagramas visuales (hexagonal-tickets-service.mermaid, sig-desk-der) para reflejar estos nombres — ver pendientes_abiertos"

principios_de_diseño:
  - "Un dominio fundamental agrupa entidades; las entidades exponen lógicas de negocio."
  - "Las capas transversales (Agente de IA, Reportes/Auditoría) NO son dominios del mismo nivel que Organization/Resource Management/Operational Modules: no tienen entidades propias con datos maestros, sino que leen y observan a las demás."
  - "El Agente de IA nunca ejecuta acciones de forma autónoma: siempre sugiere (triage) o escala (atención directa), un humano confirma o resuelve."
  - "Workflows es el motor de reglas (if/then) que EJECUTA la automatización declarada en otros dominios (asignación de ticket, alertas de SLA, disparo de notificaciones). No es un módulo aislado."
  - "Reportes/Auditoría registra CRUD completo de todas las entidades de todos los dominios — es el dominio con mayor acoplamiento transversal."

dominios_fundamentales:

  organization:
    fundamento: "Fundamento Humano"
    descripcion: "Estructura organizacional única. Companies tiene jerarquía Empresa → Departamento → Equipo. Tanto usuarios finales como Agentes IT pertenecen a nodos de este mismo árbol (el equipo de IT es un departamento más)."
    entidades:
      - id: companies
        descripcion: "Jerarquía Empresa → Departamento → Equipo"
      - id: usuarios
        descripcion: "Usuarios finales, pertenecen a un nodo del árbol de companies"
      - id: agente_it
        descripcion: "Staff de soporte IT (Agente IT / Support), pertenecen a un nodo del árbol de companies (no son externos)"
        atributos_clave:
          - habilidad_o_categoria: "determina qué tickets puede resolver — alimenta directamente 'asignacion_de_ticket' y 'asignacion_de_it' en Tickets"
    logicas_de_negocio:
      - id: validacion_usuarios
        descripcion: "Autenticación y verificación de cuenta"
      - id: gestion_roles
        descripcion: "Roles configurables/personalizables por la organización (NO fijos)"
      - id: permisos_por_rol
        descripcion: "Matriz de qué acción sobre qué entidad puede ejecutar cada rol"
      - id: capacidad_gestion_ticket_por_rol
        descripcion: "Qué tickets ve/edita cada rol: propios / de su equipo / de su depto / todos"
      - id: gestion_jerarquia_companies
        descripcion: "Alta y mantenimiento de la estructura empresa→depto→equipo"
      - id: pertenencia_usuario_nodo
        descripcion: "A qué depto/equipo pertenece cada usuario"
      - id: pertenencia_agente_it_nodo
        descripcion: "A qué depto/equipo pertenece cada agente IT (el equipo IT es un nodo más)"
      - id: gestion_habilidad_agente_it
        descripcion: "Categorías de ticket que cada agente IT puede atender — regla consumida por Tickets.asignacion_de_ticket y Tickets.asignacion_de_it"

  resource_management:
    fundamento: "Fundamento Operativo"
    descripcion: "Recursos = activos físicos/IT. Pueden compartirse entre varios departamentos/equipos (relación muchos-a-muchos con Organization.companies)."
    entidades:
      - id: hardware
      - id: software_licencias
      - id: infraestructura_red
    logicas_de_negocio:
      - id: inventario_recursos
        descripcion: "Alta, catalogación y baja del recurso"
      - id: vinculacion_recurso_company
        descripcion: "Relación muchos-a-muchos entre recurso y depto/equipo de Organization.companies"
      - id: gestion_responsables_recurso
        descripcion: "Managers/propietarios funcionales del recurso — alimenta Tickets.administracion_destinatarios (quién se notifica además del creador del ticket)"
      - id: lifecycle_recurso
        descripcion: "Estados: adquisición → en uso → mantenimiento → baja"
      - id: vinculacion_obligatoria_con_tickets
        descripcion: "Todo ticket referencia un recurso específico obligatoriamente al crearse"
      - id: historial_recurso
        descripcion: "Tickets asociados, cambios de estado y mantenimientos del recurso"
      - id: administracion_vencimientos_mantenimiento
        descripcion: "Timers de vencimiento de licencia / mantenimiento programado — dispara alertas hacia Operational_Modules.notificaciones (crítico, requiere automatización)"

  operational_modules:
    fundamento: "Capacidades"
    descripcion: "Módulos funcionales: qué hace el sistema. NO deben contener actores humanos (Agentes vive en Organization)."

    modulo_tickets:
      entidad: tickets
      logicas_de_negocio:
        - id: crear_ticket
          descripcion: "Punto de entrada del flujo"
        - id: gestion_ticket
          descripcion: "Orquestador central, agrupa 4 sub-procesos internos"
          sub_procesos:
            - id: lifecycle_ticket
              descripcion: "Estados: abierto → en progreso → resuelto → cerrado → reabierto"
            - id: administracion_slas
              descripcion: "Tiempos, timers, alertas de incumplimiento"
            - id: administracion_destinatarios
              descripcion: "A quién se NOTIFICA (creador, managers del recurso, stakeholders) — distinto de quién resuelve"
            - id: asignacion_de_ticket
              descripcion: "Asigna el PRIMER responsable, por regla automática de categoría/habilidad del agente IT, con opción de reasignación manual. Independiente de administracion_destinatarios."
        - id: historial_ticket
          descripcion: "Registro/salida de gestion_ticket"
        - id: asignacion_de_it
          descripcion: "Deriva a un agente IT/equipo especializado — SOLO si el responsable inicial (asignacion_de_ticket) determina que se necesita. Independiente de administracion_destinatarios."
        - id: it_gestion
          descripcion: "Trabajo de resolución que realiza el equipo IT especializado"
        - id: historial_multiples_it
          descripcion: "Registro agregado cuando varios equipos IT intervienen en un mismo ticket"
        - id: metricas_por_it
        - id: metricas_por_depto_it

    modulo_workflows:
      entidad: workflows
      descripcion: "Motor de reglas transversal — ejecuta, no solo declara, la automatización de otros dominios"
      logicas_de_negocio:
        - id: editor_reglas_if_then
          descripcion: "Interfaz de admin para construir condiciones y acciones"
        - id: workflow_por_categoria_ticket
          descripcion: "Cada categoría de ticket puede tener su propio workflow"
        - id: motor_ejecucion_reglas
          descripcion: "Evalúa condiciones y dispara acciones sobre: asignacion_de_ticket, asignacion_de_it, administracion_slas, administracion_destinatarios, notificaciones"
        - id: versionado_workflows
        - id: activacion_desactivacion_workflows

    modulo_notificaciones:
      entidad: notificaciones
      logicas_de_negocio:
        - id: gestion_canales
          descripcion: "Email, push, SMS, in-app"
        - id: plantillas_por_evento
          descripcion: "Una plantilla configurable por tipo de disparador"
        - id: reglas_de_disparo
          descripcion: "Ejecutadas por Workflows, no son lógica propia de Notificaciones"
        - id: resolucion_destinatarios
          descripcion: "Toma la lista de Tickets.administracion_destinatarios o Resource_Management.gestion_responsables_recurso y decide el envío efectivo"
        - id: preferencias_canal_usuario
        - id: historial_notificaciones_enviadas

capas_transversales:
  # Estas capas NO son dominios del mismo nivel. No tienen datos maestros propios;
  # leen/observan/sugieren sobre las entidades de los 3 dominios fundamentales.

  agente_ia:
    descripcion: "Nunca ejecuta acciones de forma autónoma sobre el sistema. Siempre sugiere o escala."
    roles:
      - id: triage_asistido
        autonomia: "Solo sugiere (categoría, prioridad, primer responsable) — requiere confirmación humana antes de ejecutar"
      - id: asistencia_agentes_copiloto
        descripcion: "Sugerencias de respuesta, resumen de contexto, recomendación de soluciones previas"
      - id: atencion_directa_chatbot
        autonomia: "NUNCA cierra un ticket por sí solo — siempre debe escalar a un agente humano en algún punto"
    acceso_a_datos:
      - "Lectura de Tickets.historial_ticket (base de conocimiento)"
      - "Lectura de Resource_Management.historial_recurso"
    logicas_de_negocio:
      - id: registro_sugerencias_intervenciones
        descripcion: "Feedback loop — alimenta capas_transversales.reportes_auditoria.metricas_efectividad_ia"

  reportes_auditoria:
    descripcion: "Máximo acoplamiento transversal: registra CRUD completo de TODAS las entidades de TODOS los dominios."
    logicas_de_negocio:
      - id: log_auditoria_universal
        descripcion: "Quién, qué, cuándo, sobre qué entidad, valor anterior/nuevo — todos los dominios"
      - id: filtrado_por_alcance_rol
        descripcion: "Reutiliza Organization.permisos_por_rol — un manager de depto solo ve su alcance"
      - id: dashboards_tiempo_real
        descripcion: "Requiere arquitectura basada en eventos, no solo consultas periódicas"
      - id: reportes_cumplimiento_sla
        descripcion: "Agregado desde Tickets.administracion_slas"
      - id: metricas_efectividad_ia
        descripcion: "Qué tan seguido las sugerencias del agente_ia fueron aceptadas"
      - id: exportacion_reportes
        estado: "PENDIENTE DE CONFIRMAR — no definido explícitamente en la sesión de diseño"

relaciones_clave_entre_dominios:
  - de: organization.agente_it.habilidad_o_categoria
    a: operational_modules.modulo_tickets.asignacion_de_ticket
    tipo: "determina la regla de asignación automática"
  - de: resource_management.gestion_responsables_recurso
    a: operational_modules.modulo_tickets.administracion_destinatarios
    tipo: "alimenta la lista de destinatarios de notificación"
  - de: resource_management.administracion_vencimientos_mantenimiento
    a: operational_modules.modulo_notificaciones
    tipo: "dispara alerta"
  - de: operational_modules.modulo_workflows.motor_ejecucion_reglas
    a: [asignacion_de_ticket, administracion_slas, administracion_destinatarios, notificaciones]
    tipo: "ejecuta automatización"
  - de: capas_transversales.agente_ia
    a: operational_modules.modulo_tickets.asignacion_de_ticket
    tipo: "sugiere, requiere confirmación humana"
  - de: [organization, resource_management, operational_modules]
    a: capas_transversales.reportes_auditoria.log_auditoria_universal
    tipo: "todo CRUD se registra"

arquitectura_general:
  estilo: "Hexagonal (ports & adapters) por módulo + DDD para el modelado estratégico"
  despliegue: "Monolito modular en Go (ver ADR-0006) — un único binario (cmd/api/main.go), módulos como paquetes bajo internal/ (tickets, catalog, platform, …), cada uno con su propia arquitectura hexagonal (domain/application/ports/adapters). Una sola base de datos PostgreSQL compartida (ver BACKEND/migrations/), no una base propia por bounded context. La extracción de un módulo a microservicio con base de datos propia es una posibilidad futura, condicionada a necesidades demostrables de escalabilidad, despliegue independiente o aislamiento operacional (ver ADR-0006), no el estado actual."
  comunicacion_entre_servicios: "No aplica todavía en sentido estricto: al no haber servicios separados, la comunicación entre módulos es por llamadas de función in-process dentro del mismo binario (ver ADR-0006). Kafka (ADR-0004) y coreografía de eventos entre servicios quedan diferidos, no descartados, para cuando (y si) se extraigan módulos a microservicios separados. Excepción histórica que se mantiene como principio: validación de recurso/agente IT al crear un ticket sigue siendo SÍNCRONA (decisión de ADR-0001), hoy implementada como llamada in-process en vez de HTTP."
  riesgo_aceptado:
    descripcion: "tickets-service depende síncronamente de resource-service y organization-service para validar al crear un ticket. Si alguno cae, no se pueden crear tickets."
    mitigacion_requerida: "Circuit breaker + timeout + reintentos en el adaptador de salida (RecursoValidatorPort / AgenteITValidatorPort). NUNCA implementar la mitigación dentro del dominio."

clasificacion_estrategica_ddd:
  core_domain:
    - servicio: tickets_service
      motivo: "Corazón del negocio, reglas propias no triviales (lifecycle, SLA, asignación por habilidad). Justifica hexagonal completo con rigor."
  supporting_subdomains:
    - servicio: organization_service
      motivo: "Necesario pero no diferenciador. Hexagonal más ligero, casi CRUD con validaciones."
    - servicio: resource_service
      motivo: "Necesario pero no diferenciador. Hexagonal más ligero, casi CRUD con validaciones."
  generic_subdomains:
    - servicio: workflow_service
      nota: "Decisión: Temporal (durable execution) — ver ADR-0003. Los workflows reales requieren pasos de larga duración con decisiones humanas intermedias, no solo reglas if/then reactivas"
    - servicio: notification_service
    - servicio: audit_service
      nota: "Sumidero puro de eventos, no publica eventos de negocio propios"
    - servicio: ai_advisor_service
      nota: "Consumidor asíncrono, nunca ejecuta acciones autónomas sobre el sistema"

mapa_de_servicios:
  tickets_service:
    contiene: [tickets, categorias_ticket, ticket_asignacion, ticket_asignacion_it, ticket_sla, ticket_destinatarios, ticket_historial]
    clasificacion: core_domain
  organization_service:
    contiene: [companies, usuarios, agente_it, roles, permisos]
    clasificacion: supporting_subdomain
  resource_service:
    contiene: [recursos, hardware, software_licencias, infraestructura_red, recurso_responsables]
    clasificacion: supporting_subdomain
  workflow_service:
    contiene: [workflows, workflow_reglas]
    clasificacion: generic_subdomain
  notification_service:
    contiene: [notificaciones, plantillas_notificacion, preferencias_canal_usuario]
    clasificacion: generic_subdomain
  ai_advisor_service:
    contiene: [agente_ia_sugerencias]
    clasificacion: generic_subdomain_transversal
  audit_service:
    contiene: [log_auditoria]
    clasificacion: generic_subdomain_transversal

catalogo_domain_events:
  # EXTRAÍDO a domain-events.yaml (archivo independiente) para evitar
  # duplicación y que exista una única fuente de verdad sobre eventos.
  # Ver también asyncapi.yaml, generado a partir de ese catálogo con
  # schemas de payload formales.
  ubicacion: "domain-events.yaml"
  version_extraccion: "1.0"
  fecha_extraccion: "2026-07-03"
  resumen_servicios: [organization_service, resource_service, tickets_service, workflow_service, notification_service, ai_advisor_service, audit_service]
  nota: "audit_service no publica eventos propios — se suscribe a todos los eventos de todos los servicios listados. Ver domain-events.yaml para el detalle completo de trigger/payload/consumidores por evento."

hexagonal_tickets_service:
  dominio:
    aggregate_root: Ticket
    entidades_hijas: [TicketAsignacion, TicketSLA, TicketDestinatarios, TicketHistorial]
    invariantes_ejemplo: "No se puede cerrar un ticket sin SLA cumplido o justificado explícitamente"
  application_layer:
    use_cases: [CrearTicketUseCase, AsignarTicketUseCase, EscalarAITUseCase, CerrarTicketUseCase]
  puertos_entrada:
    - TicketCommandPort
  puertos_salida:
    - TicketRepositoryPort
    - RecursoValidatorPort
    - AgenteITValidatorPort
    - EventPublisherPort
  adaptadores_entrada:
    - TicketRestController
    - TicketMessageConsumer
  adaptadores_salida:
    - PostgresTicketRepository
    - ResourceServiceHttpAdapter
    - OrganizationServiceHttpAdapter
    - KafkaEventPublisher

pendientes_abiertos:
  - "Exportación de reportes (formato, frecuencia) — no confirmado"
  - "Detalle de qué dispara exactamente el paso de asignacion_de_ticket a asignacion_de_it (¿decisión manual siempre, o también puede ser automática por categoría?)"
  - "Circuit breaker / timeout / reintentos concretos para RecursoValidatorPort y AgenteITValidatorPort — decisión de sincronía ya tomada, falta definir parámetros (timeout, umbral de apertura del breaker)"
  - "[RESUELTO v0.4] Elegir tecnología de bus de mensajería — Kafka, ver ADR-0004. Sub-pendiente: elegir proveedor gestionado específico (Confluent Cloud / AWS MSK / Aiven)"
  - "[RESUELTO v0.4] Evaluar si workflow_service se construye propio o se adopta un motor existente — Temporal, ver ADR-0003. Sub-pendiente: Temporal Cloud vs. Temporal Server self-hosted, y definir 2-3 workflows reales con timeouts/reintentos concretos"
  - "Diagramas visuales (sig-desk-architecture.mermaid, sig-desk-der.png/svg) generados en esta sesión — mantener sincronizados ante cualquier cambio futuro"
  - "Propagar el rename agente→agente_it / especialidad→habilidad (v0.2) a los diagramas visuales existentes (hexagonal-tickets-service, DER) — todavía muestran los nombres anteriores"
  - "Definir estrategia de particionado y política de retención por tópico en Kafka (ver ADR-0004, pendiente de implementación)"

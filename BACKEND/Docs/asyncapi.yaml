asyncapi: 3.0.0

info:
  title: SIG-Desk — Bus de Eventos de Dominio
  version: "1.0.0"
  description: >
    Contrato formal de eventos de dominio para SIG-Desk, generado a partir de
    domain-events.yaml. Cubre la coreografía basada en eventos entre todos los
    microservicios (organization_service, resource_service, tickets_service,
    workflow_service, notification_service, ai_advisor_service, audit_service).

    Excepción documentada: la validación de recurso/agente IT al crear un
    ticket es síncrona vía HTTP, no pasa por este bus (ver ADR-0001).

    Tecnología de bus: PENDIENTE DE CONFIRMAR (Kafka, RabbitMQ u otra —
    ver pendientes_abiertos en sig-desk-architecture-spec.yaml).
  tags:
    - name: organization_service
    - name: resource_service
    - name: tickets_service
    - name: workflow_service
    - name: notification_service
    - name: ai_advisor_service

defaultContentType: application/json

servers:
  event-bus:
    host: "TBD"
    protocol: "TBD"
    description: >
      Placeholder — tecnología de bus de mensajería aún no elegida.
      Actualizar host/protocol una vez definido (Kafka, RabbitMQ, etc.)


  onTicketEstadoCambiado:
    action: send
    channel: { $ref: '#/channels/TicketEstadoCambiado' }
    tags: [{ name: tickets_service }]
    description: "Publicado por tickets_service. Consumidores: notification_service, ai_advisor_service, audit_service"

    tags: [{ name: ai_advisor_service }]
    description: "Publicado por ai_advisor_service. Consumidores: tickets_service, notification_service"

components:
  messages:

    CompanyCreada:
      payload:
        type: object
        properties:
          company_id: { type: string, format: uuid }
          tipo: { type: string, enum: [empresa, departamento, equipo] }
          parent_id: { type: string, format: uuid, nullable: true }
        required: [company_id, tipo]

    CompanyActualizada:
      payload:
        type: object
        properties:
          company_id: { type: string, format: uuid }
          cambios: { type: object, additionalProperties: true }
        required: [company_id, cambios]

    UsuarioCreado:
      payload:
        type: object
        properties:
          usuario_id: { type: string, format: uuid }
          company_id: { type: string, format: uuid }
          role_id: { type: string, format: uuid }
        required: [usuario_id, company_id, role_id]

    UsuarioActualizado:
      payload:
        type: object
        properties:
          usuario_id: { type: string, format: uuid }
          cambios: { type: object, additionalProperties: true }
        required: [usuario_id, cambios]

    UsuarioDesactivado:
      payload:
        type: object
        properties:
          usuario_id: { type: string, format: uuid }
        required: [usuario_id]

    AgenteITCreado:
      payload:
        type: object
        properties:
          agente_it_id: { type: string, format: uuid }
          usuario_id: { type: string, format: uuid }
          habilidad: { type: string }
        required: [agente_it_id, usuario_id, habilidad]

    AgenteITHabilidadActualizada:
      payload:
        type: object
        properties:
          agente_it_id: { type: string, format: uuid }
          habilidad_nueva: { type: string }
        required: [agente_it_id, habilidad_nueva]

    AgenteITCapacidadCargaActualizada:
      payload:
        type: object
        properties:
          agente_it_id: { type: string, format: uuid }
          capacidad: { type: integer, minimum: 0 }
        required: [agente_it_id, capacidad]

    RolCreado:
      payload:
        type: object
        properties:
          role_id: { type: string, format: uuid }
        required: [role_id]

    RolPermisosActualizado:
      payload:
        type: object
        properties:
          role_id: { type: string, format: uuid }
          permisos: { type: object, additionalProperties: true }
        required: [role_id, permisos]

    RecursoCreado:
      payload:
        type: object
        properties:
          recurso_id: { type: string, format: uuid }
          tipo: { type: string, enum: [hardware, software_licencia, infraestructura_red] }
        required: [recurso_id, tipo]

    RecursoEstadoCambiado:
      payload:
        type: object
        properties:
          recurso_id: { type: string, format: uuid }
          estado_anterior: { type: string, enum: [adquisicion, en_uso, mantenimiento, baja] }
          estado_nuevo: { type: string, enum: [adquisicion, en_uso, mantenimiento, baja] }
        required: [recurso_id, estado_anterior, estado_nuevo]

    RecursoResponsableAsignado:
      payload:
        type: object
        properties:
          recurso_id: { type: string, format: uuid }
          usuario_id: { type: string, format: uuid }
        required: [recurso_id, usuario_id]

    RecursoCompartidoConCompany:
      payload:
        type: object
        properties:
          recurso_id: { type: string, format: uuid }
          company_id: { type: string, format: uuid }
        required: [recurso_id, company_id]

    LicenciaProximaAVencer:
      payload:
        type: object
        properties:
          recurso_id: { type: string, format: uuid }
          fecha_vencimiento: { type: string, format: date-time }
        required: [recurso_id, fecha_vencimiento]

    MantenimientoProgramado:
      payload:
        type: object
        properties:
          recurso_id: { type: string, format: uuid }
          fecha_mantenimiento: { type: string, format: date-time }
        required: [recurso_id, fecha_mantenimiento]

    RecursoDadoDeBaja:
      payload:
        type: object
        properties:
          recurso_id: { type: string, format: uuid }
        required: [recurso_id]

    TicketCreado:
      payload:
        type: object
        properties:
          ticket_id: { type: string, format: uuid }
          recurso_id: { type: string, format: uuid }
          creador_id: { type: string, format: uuid }
          categoria_id: { type: string, format: uuid }
        required: [ticket_id, recurso_id, creador_id, categoria_id]

    TicketAsignado:
      payload:
        type: object
        properties:
          ticket_id: { type: string, format: uuid }
          agente_it_id: { type: string, format: uuid }
          tipo_asignacion: { type: string, enum: [automatica, manual] }
        required: [ticket_id, agente_it_id, tipo_asignacion]

    TicketReasignado:
      payload:
        type: object
        properties:
          ticket_id: { type: string, format: uuid }
          agente_it_anterior: { type: string, format: uuid }
          agente_it_nuevo: { type: string, format: uuid }
        required: [ticket_id, agente_it_anterior, agente_it_nuevo]

    TicketEscaladoAIT:
      payload:
        type: object
        properties:
          ticket_id: { type: string, format: uuid }
          agente_it_id: { type: string, format: uuid }
        required: [ticket_id, agente_it_id]

    TicketEstadoCambiado:
      payload:
        type: object
        properties:
          ticket_id: { type: string, format: uuid }
          estado_anterior: { type: string, enum: [abierto, en_progreso, resuelto, cerrado, reabierto] }
          estado_nuevo: { type: string, enum: [abierto, en_progreso, resuelto, cerrado, reabierto] }
        required: [ticket_id, estado_anterior, estado_nuevo]

    TicketSLAEnRiesgo:
      payload:
        type: object
        properties:
          ticket_id: { type: string, format: uuid }
          tiempo_restante: { type: integer, description: "segundos — unidad a confirmar" }
        required: [ticket_id, tiempo_restante]

    TicketSLAIncumplido:
      payload:
        type: object
        properties:
          ticket_id: { type: string, format: uuid }
          tiempo_excedido: { type: integer, description: "segundos — unidad a confirmar" }
        required: [ticket_id, tiempo_excedido]

    TicketDestinatariosActualizados:
      payload:
        type: object
        properties:
          ticket_id: { type: string, format: uuid }
          destinatarios:
            type: array
            items: { type: string, format: uuid }
        required: [ticket_id, destinatarios]

    TicketResuelto:
      payload:
        type: object
        properties:
          ticket_id: { type: string, format: uuid }
        required: [ticket_id]

    TicketCerrado:
      payload:
        type: object
        properties:
          ticket_id: { type: string, format: uuid }

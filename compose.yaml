services:
  postgres:
    image: postgres:17-alpine
    container_name: sigdesk-postgres
    environment:
      POSTGRES_DB: sigdesk
      POSTGRES_USER: sigdesk
      POSTGRES_PASSWORD: sigdesk
    ports:
      - "5432:5432"
    volumes:
      - sigdesk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigdesk -d sigdesk"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: sigdesk-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: ${PORT:-8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3003,http://localhost:5173,http://localhost:5199,http://localhost:80,http://web:80}
      DATABASE_URL: postgres://sigdesk:sigdesk@postgres:5432/sigdesk?sslmode=disable
      ATTACHMENTS_DIR: /data/attachments
      SIGTOOLS_API_URL: ${SIGTOOLS_API_URL:-}
      SIGDESK_BOOTSTRAP_ADMINS: ${SIGDESK_BOOTSTRAP_ADMINS:-}
    ports:
      - "8080:8080"
    volumes:
      - sigdesk_attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
    container_name: sigdesk-web
    ports:
      - "3003:80"
    depends_on:
      api:
        condition: service_started

volumes:
  sigdesk_postgres_data:
  sigdesk_attachments:

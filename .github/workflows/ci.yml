name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: FRONTEND
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: FRONTEND/.nvmrc
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: sig-desk-frontend-dist
          path: FRONTEND/dist
          retention-days: 7

name: E2E

# Deliberately NOT required yet: this is the first workflow to exercise the
# tickets/catalog/sla Postgres adapters together end-to-end and to boot the
# real API binary in CI. Per the stabilization plan it stays informational
# until PR 6, after the pre-existing Catalog Builder/Template Designer e2e
# failures tracked in issue #5 are resolved and the full Playwright suite can
# be run here instead of just the incident golden path.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false

jobs:
  e2e:
    name: e2e (incident golden path)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: sigdesk
          POSTGRES_PASSWORD: sigdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigdesk -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: BACKEND/go.mod
          cache-dependency-path: BACKEND/go.sum

      # Runs before anything frontend-related: a red result here means the
      # tickets/catalog/sla Postgres adapters (or the closed/reopen
      # lifecycle) regressed, not "the browser suite is flaky" — see the same
      # ordering rationale in ci.yml's migration tests.
      - name: PostgreSQL golden path (real Postgres, not in-memory)
        working-directory: BACKEND
        env:
          SIGDESK_TEST_DATABASE_URL: postgres://sigdesk:sigdesk@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 -v ./internal/platform/integration/...

      - name: Build the API binary
        working-directory: BACKEND
        run: go build -o /tmp/sigdesk-api ./cmd/api

      - name: Start the API in the background
        working-directory: BACKEND
        env:
          DATABASE_URL: postgres://sigdesk:sigdesk@localhost:5432/postgres?sslmode=disable
          PORT: 8080
          APP_ENV: development
        # nohup so the process survives this step's shell exiting — GitHub
        # Actions runs every step in a fresh shell within the same job VM,
        # and a plain `&` background job would otherwise be SIGHUP'd.
        run: |
          set -uo pipefail
          nohup /tmp/sigdesk-api > /tmp/sigdesk-api.log 2>&1 &
          echo $! > /tmp/sigdesk-api.pid

      # Bounded readiness wait (timeout), with early-exit detection: if the
      # process has already died, fail immediately with its logs instead of
      # polling a dead endpoint for the full timeout window.
      - name: Wait for the API to become ready
        run: |
          set -uo pipefail
          pid="$(cat /tmp/sigdesk-api.pid)"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::sigdesk-api (pid $pid) exited before becoming ready"
              echo "--- sigdesk-api.log ---"
              cat /tmp/sigdesk-api.log
              exit 1
            fi
            if curl -sf http://127.0.0.1:8080/health/ready > /dev/null; then
              echo "API became ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become ready within 60s"
          echo "--- sigdesk-api.log ---"
          cat /tmp/sigdesk-api.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: FRONTEND/.nvmrc
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json

      - name: Install frontend dependencies
        working-directory: FRONTEND
        run: npm ci

      - name: Install Playwright browsers
        working-directory: FRONTEND
        run: npx playwright install --with-deps chromium

      # Only the incident golden path, not the full suite: 8 pre-existing
      # Catalog Builder / Template Designer e2e failures are tracked in
      # issue #5, confirmed unrelated to this change (they fail identically
      # on the commit before this PR). Running the full suite here would mean
      # this workflow could never be green. It becomes the full suite, and
      # mandatory, in PR 6 once those are fixed.
      - name: Run the incident golden path e2e spec
        working-directory: FRONTEND
        env:
          CI: 'true'
        run: npx playwright test e2e/incident-flow.spec.ts

      - name: API server logs
        if: always()
        run: |
          echo "--- sigdesk-api.log ---"
          cat /tmp/sigdesk-api.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: FRONTEND/playwright-report/
          retention-days: 7

      - name: Stop the API server
        if: always()
        run: |
          if [ -f /tmp/sigdesk-api.pid ]; then
            kill "$(cat /tmp/sigdesk-api.pid)" 2>/dev/null || true
          fi
